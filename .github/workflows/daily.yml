name: Daily brief

on:
  schedule:
    # 10:00 UTC = 6:00 New York time in summer (EDT), 5:00 in winter (EST).
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "data/**", "src/**", "app/**", "config/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Hugging Face model weights (company tagging) download once, then come from this cache.
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-models-bert-base-NER-v1

      - name: Collect today's news and write the brief (free, no API key)
        if: github.event_name != 'push'
        run: npm run collect

      # Housing and videos don't block the defense brief: if a source is down, yesterday's data stays.
      - name: Collect housing data and news (free, no API key)
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run housing

      - name: Collect videos from config/videos.yaml (free, no API key)
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run videos

      - name: Rebuild the JSON API
        run: npm run build:api

      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "anu bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public/api
          git diff --cached --quiet || git commit -m "Daily brief $(date -u +%F)"
          git push

      - name: Build the in-browser ANU app into public/app
        run: npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
